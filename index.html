 sima:{name:'司马光',source:'《宋史》',pack:'上',opening:'今天我们一起背《司马光》，选自《宋史》。故事里的孩子们在哪里玩？试着用课文里的话告诉我。',clauses:['群儿戏于庭，','一儿登瓮，','足跌没水中。','众皆弃去，','光持石击瓮破之，','水迸，','儿得活。'],lines:[0,0,1,2,3,4,4],hooks:['故事里的孩子们在哪里玩？','一个孩子爬到哪儿去了？','他登上去以后，发生了什么？','别的孩子见了，有什么反应？','其他孩子都跑了，司马光是怎么做的？','瓮破了，水怎么样了？','水涌出来以后，那个孩子怎么样了？'],plain:['孩子们在院子里玩。','一个小孩爬上了大瓮。','他失足掉进了水里。','别的孩子都跑了。','司马光拿石头砸破了瓮。','水一下子涌了出来。','那个孩子得救了。'],question:'“瓮”是什么呀？',answer:'瓮是用来盛水的大缸。'},
 shouzhu:{name:'守株待兔',source:'《韩非子》',pack:'上',opening:'今天一起背《守株待兔》。故事开头，宋国那个人是做什么的？',clauses:['宋人有耕者。','田中有株。','兔走触株，','折颈而死。','因释其耒而守株，','冀复得兔。','兔不可复得，','而身为宋国笑。'],lines:[0,1,2,2,3,3,4,4],hooks:['宋国那个人是做什么的？','田里有什么？','兔子跑过来，撞上了什么？','兔子后来怎么样了？','农夫放下农具干什么去了？','他心里盼着什么？','他还等得到兔子吗？','宋国人怎样看待他？'],plain:['宋国有个农夫。','田里有一个树桩。','兔子撞到了树桩。','兔子折断脖子死了。','农夫守着树桩。','他希望再捡到兔子。','他没再捡到兔子。','他被宋国人笑话。'],question:'什么是“株”？',answer:'这里的“株”指露在地上的树桩。'},
 yang:{name:'杨氏之子',source:'《世说新语》',pack:'上',opening:'今天背《杨氏之子》。故事一开始，说这个孩子几岁了？',clauses:['梁国杨氏子九岁，','甚聪惠。','孔君平诣其父，','父不在，','乃呼儿出。','为设果，','果有杨梅。','孔指以示儿曰：','此是君家果。','儿应声答曰：','未闻孔雀是夫子家禽。'],lines:[0,0,1,1,1,2,2,3,3,4,4],hooks:['杨家的孩子几岁？','这个孩子怎么样？','客人来找谁？','父亲在哪儿？','客人请谁出来？','孩子摆上了什么？','果盘里有什么？','客人指着杨梅做了什么？','客人怎么说的？','孩子怎样回答？','孩子用什么话应答？'],question:'“诣”是什么意思？',answer:'“诣”在这里是前去拜访的意思。'},

 case 'record':case 'cancel':case 'processing':progress(2,0);message='他登上去以后，发生了什么？';voice=k==='processing'?'busy':k;break;

 case 'partial':progress(6,5);contextHelp=true;hintLevel=1;speaking('水涌出来以后，那个孩子怎么样了？从“儿”开头，把这小句说完整。');break;
 case 'plain':progress(6,5);contextHelp=true;hintLevel=1;speaking('对，那个孩子得救了。这句话用课文里的三个字怎么说？');break;
 case 'query':progress(2,1);speaking('瓮就是用来盛水的大缸。他登上去以后，发生了什么？');break;
 case 'hint1':case 'hint2':case 'model':progress(4,3);contextHelp=true;hintLevel={hint1:1,hint2:2,model:3}[k];speaking(k==='hint1'?'其他孩子都跑了，司马光是怎么做的？':k==='hint2'?'从“光持石”开头，把司马光做的事完整说一遍。':'听夫子读：“光持石击瓮破之。”你也把这小句完整说一遍。');break;
 case 'pron':progress(2,1);contextHelp=true;speaking('这里的“没”读 mò，是沉进水里的意思。把这一小句再说一遍。');break;
 case 'unclear':progress(2,1);speaking('刚才这小句我没听清，你再说一次，好吗？');break;
 case 'join':progress(5,4);joining=true;speaking('你把司马光的动作说全了。刚才这两句，连起来背给我听听。');break;
 case 'paused':progress(2,0);screen='list';break;
 case 'pause':progress(2,1);message='他登上去以后，发生了什么？';modal='pause';break;
 case 'resume':progress(2,1);speaking(continuation());break;
 case 'done':case 'listDone':r.n=current().clauses.length;r.best=1;r.round='done';lastStart=r.n-1;if(k==='done'){voice='done';modal='done';message='跟着夫子，你把整篇课文背出来啦！';}else screen='list';break;
 case 'restart':r.best=1;progress(0);speaking(current().opening);break;
 }render();
 if(!shot&&k==='processing'){const epoch=version;setTimeout(()=>{if(epoch===version&&screen==='practice'&&!modal)evaluateChoice('normal');},1900);}
 if(!shot&&(k==='record'||k==='cancel')){holding={y:0,pointer:null};refreshSpecial();}}
function refreshSpecial(){if(!holding||holding.pointer!==null)return;$('simulate').disabled=false;$('simulate').innerHTML=icon('HandTap')+(voice==='cancel'?'演示松手取消':'演示松手发送');}
function action(act,id){switch(act){
 case 'enter':pack='上';goList();break;
 case 'back':if(screen==='list')goHall();else if(screen==='practice'){pausedPending=voice==='busy'?choice:'';invalidate();voice='ready';modal='pause';previewKey='pause';render();}break;
 case 'guide':start(id);break;
 case 'solo':scopeMsg='「我来背」进入独立背诵。当前原型展开 AI 带背，可在左侧用「AI 带背」体验。';render();break;
 case 'pack':modal='pack';previewKey='pack';render();break;
 case 'select-pack':pack=id;modal='';previewKey='list';scopeMsg='';render();break;
 case 'close-pack':modal='';previewKey='list';render();break;
 case 'hint':getHint();break;
 case 'stay':modal='';if(pausedPending){let pick=pausedPending;pausedPending='';evaluateChoice(pick);}else{voice='ready';previewKey='ready';render();}break;
 case 'pause-save':pausedPending='';save();goList('paused');break;
 case 'completed-list':goList('listDone');break;
 case 'restart':start(article,true);break;
 }}
$('stage').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)action(b.dataset.act,b.dataset.id);});
$('stage').addEventListener('pointerdown',e=>{if(!e.target.closest('#hold')||e.button!==0)return;e.preventDefault();if(beginHold(e.clientY,e.pointerId)){try{$('stage').setPointerCapture(e.pointerId);}catch{}}});
$('stage').addEventListener('pointermove',e=>{if(!holding||holding.pointer!==e.pointerId)return;const r=$('stage').getBoundingClientRect(),next=(holding.y-e.clientY)>Math.max(18,r.height*.085)?'cancel':'record';if(voice!==next){voice=next;previewKey=next;render();}});
$('stage').addEventListener('pointerup',e=>{if(holding&&holding.pointer===e.pointerId)release();});
$('stage').addEventListener('pointercancel',e=>{if(holding&&holding.pointer===e.pointerId)release(true);});
$('stage').addEventListener('contextmenu',e=>{if(e.target.closest('#hold')||holding)e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(holding){release(true);return;}if(modal==='pause')action('stay');if(modal==='pack')action('close-pack');}if((e.key===' '||e.key==='Enter')&&!e.repeat&&e.target.id==='hold'){e.preventDefault();beginHold(0,'keyboard');}});
document.addEventListener('keyup',e=>{if(holding?.pointer==='keyboard'&&(e.key===' '||e.key==='Enter')){e.preventDefault();release();}});
window.addEventListener('blur',()=>{if(holding&&holding.pointer!==null)release(true);});
$('sample').innerHTML=choices.map(([key,name])=>'<option value="'+key+'">'+name+'</option>').join('');
$('sample').addEventListener('change',e=>{choice=e.target.value;scopeMsg='';render();refreshSpecial();});
$('simulate').addEventListener('click',()=>{if(holding?.pointer===null){release();return;}if(!beginHold(0,'sim'))return;const epoch=version;setTimeout(()=>{if(epoch===version&&holding?.pointer==='sim')release();},320);});
$('jump').innerHTML=Array.from(new Set(scenarios.map(x=>x[1]))).map(g=>'<optgroup label="'+g+'">'+scenarios.filter(s=>s[1]===g).map(s=>'<option value="'+s[0]+'">'+s[2]+'</option>').join('')+'</optgroup>').join('');
$('jump').addEventListener('change',e=>jumpTo(e.target.value));
$('next').addEventListener('click',()=>jumpTo(scenarios[(scenarios.findIndex(s=>s[0]===previewKey)+1)%scenarios.length][0]));
$('sound').addEventListener('click',()=>{if(audioOn){stopTalk();audioOn=false;}else{audioOn='speechSynthesis' in window;if(!audioOn)scopeMsg='此浏览器通过文字展示夫子的提示。';else if(screen==='practice'&&!modal&&!['record','busy','cancel','done'].includes(voice)){coach(message,previewKey);return;}}render();});
$('brand-icon').innerHTML=icon('BookOpenText');$('note-icon').innerHTML=icon('Info','visualmark');
function fit(){const w=$('slot').getBoundingClientRect().width;$('stage').style.transform='scale('+w/1100+')';}
new ResizeObserver(fit).observe($('slot'));window.addEventListener('resize',fit);
if(q.get('state')&&scenarios.some(x=>x[0]===q.get('state')))jumpTo(q.get('state'));else render();fit();
</script></body></html>
